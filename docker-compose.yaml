services:
  event-dashboard:
    build:
      context: .
      args:
        # Should match the owner of ./certs/key.pem so the container can read it.
        UID: "${DASHBOARD_UID:-1000}"
        GID: "${DASHBOARD_GID:-1000}"
      secrets:
        - ca
    image: event-dashboard:latest
    restart: unless-stopped
    ports:
      - "${DASHBOARD_HTTPS_PORT:-443}:443"
      - "${DASHBOARD_HTTP_PORT:-80}:80" # redirects to HTTPS
    environment:
      EVENT_DASHBOARD_SSL_CERTFILE: /certs/cert.pem
      EVENT_DASHBOARD_SSL_KEYFILE: /certs/key.pem
      # Redirect target port as seen by the browser (the host's HTTPS port).
      EVENT_DASHBOARD_PUBLIC_HTTPS_PORT: "${DASHBOARD_HTTPS_PORT:-443}"
      EVENT_DASHBOARD_CA_BUNDLE: /etc/event-dashboard/ca-bundle.crt
      EVENT_DASHBOARD_CACHE_TTL: "${EVENT_DASHBOARD_CACHE_TTL:-3600}"
      EVENT_DASHBOARD_FETCH_TIMEOUT: "${EVENT_DASHBOARD_FETCH_TIMEOUT:-15}"
      EVENT_DASHBOARD_LOG_LEVEL: "${EVENT_DASHBOARD_LOG_LEVEL:-INFO}"
    volumes:
      # Must exist on the host before starting (otherwise Docker creates a directory), e.g.
      # `echo '{}' > config.json`, and be writable by DASHBOARD_UID (settings are saved to it).
      - ./config.json:/data/config.json
      - ./certs:/certs:ro
      # Host CA bundle, so calendar downloads through a TLS-inspecting proxy are trusted.
      - "${DASHBOARD_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}:/etc/event-dashboard/ca-bundle.crt:ro"
    sysctls:
      # Lets the non-root user bind ports 80/443 inside the container.
      net.ipv4.ip_unprivileged_port_start: 0

secrets:
  ca:
    file: "${DASHBOARD_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}"
