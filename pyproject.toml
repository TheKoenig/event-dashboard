[project]
name = "event-dashboard"
version = "0.1.0"
description = "Web dashboard showing countdown progress bars for upcoming events from subscribed ICS/webcal calendars."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ruben Koenig", email = "koenig_ruben@outlook.de" }]
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "recurring-ical-events>=3.8.2",
    "pydantic>=2.13.5",
    "click>=8.5.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
event-dashboard = "event_dashboard.__main__:cli"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_dashboard"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "S", "D"]
# Constructor args are documented in the class docstring (Google style).
ignore = ["D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests: plain asserts are idiomatic in pytest; test functions need no docstrings.
"tests/**" = ["S101", "D103"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=event_dashboard --cov-report=term-missing"
